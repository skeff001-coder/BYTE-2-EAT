# Byte 2 Eat — Codemagic CI/CD for iOS App Store
# Developer Portal integration "byte2eat_asc" must be connected in
# Settings → Integrations → Developer Portal before running this workflow.

workflows:

  byte2eat-ios-release:
    name: Byte 2 Eat — iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: byte2eat_asc

    environment:
      groups:
        - byte2eat_env
      vars:
        XCODE_WORKSPACE: "artifacts/culinary-scan-assist/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bitecooking.app"
        APP_VERSION: "1.0.0"
        PNPM: "npx --yes pnpm@10.26.1"
      node: "22"
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install workspace dependencies
        script: |
          npx --yes pnpm@10.26.1 install --frozen-lockfile

      - name: Sync Capacitor iOS project
        script: |
          cd artifacts/culinary-scan-assist
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          pod install

      - name: Set app version and build number
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Revoke existing Distribution certificates
        script: |
          # Automatically revoke all existing iOS Distribution certificates so that
          # the next step can create a fresh one with its own private key — avoiding
          # the "Cannot save Signing Certificates without certificate private key" error.
          set +e
          python3 << 'PYEOF'
import time, base64, json, os, urllib.request, urllib.error

def generate_jwt():
    from cryptography.hazmat.primitives import hashes, serialization
    from cryptography.hazmat.primitives.asymmetric import ec
    from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
    from cryptography.hazmat.backends import default_backend

    key_id     = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER']
    issuer_id  = os.environ['APP_STORE_CONNECT_ISSUER_ID']
    pem        = os.environ['APP_STORE_CONNECT_PRIVATE_KEY']

    now = int(time.time())
    header  = {'alg': 'ES256', 'kid': key_id, 'typ': 'JWT'}
    payload = {'iss': issuer_id, 'iat': now, 'exp': now + 1200,
               'aud': 'appstoreconnect-v1'}

    def b64url(obj):
        data = json.dumps(obj, separators=(',', ':')).encode() if isinstance(obj, dict) else (obj if isinstance(obj, bytes) else obj.encode())
        return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

    unsigned = f"{b64url(header)}.{b64url(payload)}"
    key = serialization.load_pem_private_key(pem.encode(), password=None, backend=default_backend())
    sig = key.sign(unsigned.encode(), ec.ECDSA(hashes.SHA256()))
    r, s = decode_dss_signature(sig)
    return f"{unsigned}.{b64url(r.to_bytes(32,'big') + s.to_bytes(32,'big'))}"

try:
    token = generate_jwt()
    headers = {'Authorization': f'Bearer {token}'}

    url = 'https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=IOS_DISTRIBUTION&limit=200'
    data = json.loads(urllib.request.urlopen(urllib.request.Request(url, headers=headers)).read())
    certs = data.get('data', [])
    print(f'Found {len(certs)} Distribution certificate(s) — revoking all')

    for cert in certs:
        cid = cert['id']
        req = urllib.request.Request(
            f'https://api.appstoreconnect.apple.com/v1/certificates/{cid}',
            method='DELETE', headers=headers)
        try:
            urllib.request.urlopen(req)
            print(f'  Revoked {cid}')
        except urllib.error.HTTPError as e:
            print(f'  {cid}: {e.code} {e.reason} (continuing)')
except Exception as e:
    print(f'Certificate cleanup skipped: {e}')
PYEOF
          set -e

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch or create signing certificate and provisioning profile
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Apply code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "Release"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - support@byte2eat.app
        notify:
          success: true
          failure: true

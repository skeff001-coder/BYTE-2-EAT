# Byte 2 Eat — Codemagic CI/CD for iOS App Store
# Developer Portal integration "byte2eat_asc" must be connected in
# Settings → Integrations → Developer Portal before running this workflow.

workflows:

  byte2eat-ios-release:
    name: Byte 2 Eat — iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: byte2eat_asc

    environment:
      groups:
        - byte2eat_env
      vars:
        XCODE_WORKSPACE: "artifacts/culinary-scan-assist/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bitecooking.app"
        APP_VERSION: "1.0.0"
      node: "22"
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install pnpm
        script: |
          npm install -g pnpm@10

      - name: Install workspace dependencies
        script: |
          pnpm install --frozen-lockfile

      - name: Build Vite web bundle for Capacitor
        script: |
          pnpm --filter @workspace/culinary-scan-assist run build:capacitor

      - name: Sync Capacitor iOS project
        script: |
          cd artifacts/culinary-scan-assist
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          pod install

      - name: Set app version and build number
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch or create App Store signing certificate and profile
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Apply code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "Release"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - support@byte2eat.app
        notify:
          success: true
          failure: true

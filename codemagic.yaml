# ─────────────────────────────────────────────────────────────────────────────
# Byte 2 Eat — Codemagic CI/CD for iOS App Store
#
# SETUP CHECKLIST (do once in the Codemagic dashboard):
#
# 1. App Store Connect API Key
#    Dashboard → Teams → Integrations → App Store Connect
#    Generate a key at appstoreconnect.apple.com → Users & Access → Keys
#    Name it "byte2eat_asc" (Key ID, Issuer ID, .p8 file).
#
# 2. Code signing
#    Dashboard → your app → Environment → iOS code signing
#    Choose "App Store" distribution. Codemagic fetches profiles automatically.
#
# 3. Environment variable group "byte2eat_env"
#    Dashboard → Teams → Global variables & secrets → Add group
#    Add: VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY (mark as secret).
#
# ─────────────────────────────────────────────────────────────────────────────

workflows:

  byte2eat-ios-release:
    name: Byte 2 Eat — iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: byte2eat_asc

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bitecooking.app
      groups:
        - byte2eat_env
      vars:
        XCODE_WORKSPACE: "artifacts/culinary-scan-assist/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bitecooking.app"
        APP_VERSION: "1.0.0"
      node: "22"
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install pnpm
        script: |
          npm install -g pnpm@10

      - name: Install workspace dependencies
        script: |
          pnpm install --frozen-lockfile

      - name: Build Vite web bundle for Capacitor
        script: |
          pnpm --filter @workspace/culinary-scan-assist run build:capacitor

      - name: Sync Capacitor iOS project
        script: |
          cd artifacts/culinary-scan-assist
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          pod install

      - name: Set app version and build number
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Apply code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "Release"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - support@byte2eat.app
        notify:
          success: true
          failure: true

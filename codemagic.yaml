# Byte 2 Eat — Codemagic CI/CD for iOS App Store
# Developer Portal integration "byte2eat_asc" must be connected in
# Settings → Integrations → Developer Portal before running this workflow.

workflows:

  byte2eat-ios-release:
    name: Byte 2 Eat — iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: byte2eat_asc

    environment:
      groups:
        - byte2eat_env
      vars:
        XCODE_WORKSPACE: "artifacts/culinary-scan-assist/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bitecooking.app"
        APP_VERSION: "1.0.0"
        PNPM: "npx --yes pnpm@10.26.1"
      node: "22"
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install workspace dependencies
        script: |
          npx --yes pnpm@10.26.1 install --frozen-lockfile

      - name: Sync Capacitor iOS project
        script: |
          cd artifacts/culinary-scan-assist
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          pod install

      - name: Set app version and build number
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Revoke existing Distribution certificates
        script: |
          set +e
          echo "=== ALL certificates in account ==="
          ALL_JSON=$(app-store-connect certificates list --json 2>/dev/null || echo "[]")
          echo "$ALL_JSON" | head -c 1000
          echo ""
          echo "=== Revoking distribution certs ==="
          CERT_IDS=$(echo "$ALL_JSON" | python3 -c "import json,sys;d=json.load(sys.stdin);items=d if isinstance(d,list) else d.get('data',[]);[print(i['id']) for i in items if 'DIST' in i.get('attributes',{}).get('certificateType','')]" 2>/dev/null || echo "")
          echo "IDs to revoke: $CERT_IDS"
          for ID in $CERT_IDS; do
            echo "Revoking $ID..."
            app-store-connect certificates revoke "$ID" 2>&1 || true
          done
          echo "=== Certificate cleanup done ==="
          set -e

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch or create signing certificate and provisioning profile
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Apply code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "Release"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - support@byte2eat.app
        notify:
          success: true
          failure: true

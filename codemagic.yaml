# Byte 2 Eat — Codemagic CI/CD for iOS App Store
# Requires environment group "byte2eat_env" with:
#   CERTIFICATE_PRIVATE_KEY       — RSA private key (PEM) for certificate signing
#   VITE_SUPABASE_URL             — Supabase project URL
#   VITE_SUPABASE_PUBLISHABLE_KEY — Supabase anon key

workflows:

  byte2eat-ios-release:
    name: Byte 2 Eat — iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: byte2eat_asc

    environment:
      groups:
        - byte2eat_env
      vars:
        XCODE_WORKSPACE: "artifacts/culinary-scan-assist/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "Com.bitecooking.app"
        APP_VERSION: "1.0.0"
      node: "22"
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install workspace dependencies
        script: |
          npx --yes pnpm@10.26.1 install --frozen-lockfile

      - name: Sync Capacitor iOS project
        script: |
          cd artifacts/culinary-scan-assist
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          pod install

      - name: Set app version and build number
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Fetch signing files
        script: |
          set -ex
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          # Find the downloaded profile
          PROFILE_PATH=$(ls "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)
          echo "Profile path: $PROFILE_PATH"
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | python3 -c "import plistlib,sys; d=plistlib.loads(sys.stdin.buffer.read()); print(d['Name'])")
          echo "Profile name: $PROFILE_NAME"
          echo "$PROFILE_NAME" > /tmp/profile_name.txt

      - name: Build iOS IPA
        script: |
          PROFILE_NAME=$(cat /tmp/profile_name.txt)
          echo "Building with profile: $PROFILE_NAME"
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_DIR"
          # Write profile specifier only into the App target Release config
          python3 - <<PYEOF
import re, sys
path = "artifacts/culinary-scan-assist/ios/App/App.xcodeproj/project.pbxproj"
profile = open("/tmp/profile_name.txt").read().strip()
content = open(path).read()
# Target the App target Release section (has DEVELOPMENT_TEAM and com.bitecooking.app)
old = 'CODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\t\tCURRENT_PROJECT_VERSION'
new = f'CODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\t\tCURRENT_PROJECT_VERSION'
# Add PROVISIONING_PROFILE_SPECIFIER if not already present
if 'PROVISIONING_PROFILE_SPECIFIER' not in content:
    content = content.replace(
        'CODE_SIGN_STYLE = Manual;\n\t\t\t\t\tCURRENT_PROJECT_VERSION = 1;\n\t\t\t\t\tINFOPLIST_FILE',
        f'CODE_SIGN_STYLE = Manual;\n\t\t\t\t\tCURRENT_PROJECT_VERSION = 1;\n\t\t\t\t\tINFOPLIST_FILE'
    )
    content = content.replace(
        'DEVELOPMENT_TEAM = J6N9GAHK44;\n\t\t\t\t\tINFOPLIST_FILE',
        f'DEVELOPMENT_TEAM = J6N9GAHK44;\n\t\t\t\t\tINFOPLIST_FILE'
    )
    # Insert before PRODUCT_BUNDLE_IDENTIFIER in the Release target config
    content = content.replace(
        '\t\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = Com.bitecooking.app;\n\t\t\t\t\tPRODUCT_NAME = "$(TARGET_NAME)";\n\t\t\t\t\tSWIFT_ACTIVE_COMPILATION_CONDITIONS = ""',
        f'\t\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = Com.bitecooking.app;\n\t\t\t\t\tPRODUCT_NAME = "$(TARGET_NAME)";\n\t\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";\n\t\t\t\t\tSWIFT_ACTIVE_COMPILATION_CONDITIONS = ""'
    )
open(path, 'w').write(content)
print("pbxproj updated")
PYEOF
          # Archive — no global profile override so Pods use Automatic
          xcodebuild \
            -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -config Release \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO
          # Export
          cat > /tmp/ExportOptions.plist << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store</string>
  <key>teamID</key>
  <string>J6N9GAHK44</string>
  <key>signingStyle</key>
  <string>manual</string>
  <key>provisioningProfiles</key>
  <dict>
    <key>Com.bitecooking.app</key>
    <string>$PROFILE_NAME</string>
  </dict>
</dict>
</plist>
EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$IPA_DIR"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - support@byte2eat.app
        notify:
          success: true
          failure: true

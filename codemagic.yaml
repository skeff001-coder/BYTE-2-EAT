# Byte 2 Eat — Codemagic CI/CD for iOS App Store
# Developer Portal integration "byte2eat_asc" must be connected in
# Settings → Integrations → Developer Portal before running this workflow.

workflows:

  byte2eat-ios-release:
    name: Byte 2 Eat — iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: byte2eat_asc

    environment:
      groups:
        - byte2eat_env
      vars:
        XCODE_WORKSPACE: "artifacts/culinary-scan-assist/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bitecooking.app"
        APP_VERSION: "1.0.0"
        PNPM: "npx --yes pnpm@10.26.1"
      node: "22"
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install workspace dependencies
        script: |
          npx --yes pnpm@10.26.1 install --frozen-lockfile

      - name: Sync Capacitor iOS project
        script: |
          cd artifacts/culinary-scan-assist
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          pod install

      - name: Set app version and build number
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Revoke existing Distribution certificates
        script: |
          set +e
          for TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            CERT_IDS=$(app-store-connect certificates list --type "$TYPE" --json 2>/dev/null | \
              python3 -c "import json,sys; [print(c['id']) for c in json.load(sys.stdin)]" 2>/dev/null)
            if [ -n "$CERT_IDS" ]; then
              echo "Revoking $TYPE certs: $CERT_IDS"
              app-store-connect certificates revoke $CERT_IDS || echo "  (revoke returned non-zero)"
            else
              echo "No $TYPE certificates found to revoke"
            fi
          done
          set -e

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch or create signing certificate and provisioning profile
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Apply code signing profiles and build iOS IPA
        script: |
          WORKSPACE="$CM_BUILD_DIR/$XCODE_WORKSPACE"
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"

          # Debug: find all provisioning profiles on the machine
          echo "=== Provisioning profiles found ==="
          find /Users/builder/Library/MobileDevice/Provisioning\ Profiles \
               ~/Library/MobileDevice/Provisioning\ Profiles \
               -name "*.mobileprovision" 2>/dev/null || echo "None found in default locations"
          find /tmp /Users/builder -name "*.mobileprovision" 2>/dev/null | head -10 || true

          # Find profile and extract UUID
          PROFILE_PATH=$(find /Users/builder/Library/MobileDevice/Provisioning\ Profiles \
                              ~/Library/MobileDevice/Provisioning\ Profiles \
                              -name "*.mobileprovision" 2>/dev/null | head -1)
          echo "Profile path: $PROFILE_PATH"
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found. Listing app-store-connect output dirs..."
            ls -la "$HOME/.appstoreconnect/" 2>/dev/null || true
            ls -la "$HOME/.appstoreconnect/profiles/" 2>/dev/null || true
            exit 1
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | python3 -c "import plistlib,sys; d=plistlib.loads(sys.stdin.buffer.read()); print(d['UUID'])")
          echo "Profile UUID: $PROFILE_UUID"

          # Apply profile to Xcode project then archive
          xcode-project use-profiles
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -config "Release" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="J6N9GAHK44" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

          # Export IPA
          mkdir -p "$IPA_DIR"
          python3 -c "import plistlib; plistlib.dump({'method':'app-store','teamID':'J6N9GAHK44'}, open('/tmp/exportOptions.plist','wb'))"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist /tmp/exportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - support@byte2eat.app
        notify:
          success: true
          failure: true

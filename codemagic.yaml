# Byte 2 Eat — Codemagic CI/CD for iOS App Store
# Developer Portal integration "byte2eat_asc" must be connected in
# Settings → Integrations → Developer Portal before running this workflow.

workflows:

  byte2eat-ios-release:
    name: Byte 2 Eat — iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: byte2eat_asc

    environment:
      groups:
        - byte2eat_env
      vars:
        XCODE_WORKSPACE: "artifacts/culinary-scan-assist/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bitecooking.app"
        APP_VERSION: "1.0.0"
        PNPM: "npx --yes pnpm@10.26.1"
      node: "22"
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install workspace dependencies
        script: |
          set -e
          npx --yes pnpm@10.26.1 install --frozen-lockfile

          # pnpm marks cross-platform optional native packages as '-' (excluded) in
          # lockfiles generated on Linux. Detect the actual resolved versions from the
          # pnpm virtual store, then download the macOS ARM64 native binaries directly
          # from the npm registry via curl and extract them into root node_modules.
          install_native() {
            local PKG="$1" TARBALL_NAME="$2" DEST="$3"
            echo "→ Installing ${PKG}@${4} → node_modules/${DEST}"
            rm -rf "/tmp/native-${TARBALL_NAME}" && mkdir -p "/tmp/native-${TARBALL_NAME}"
            curl -fsSL "https://registry.npmjs.org/${PKG}/-/${TARBALL_NAME}-${4}.tgz" \
              | tar -xz --strip-components=1 -C "/tmp/native-${TARBALL_NAME}"
            mkdir -p "$(dirname "node_modules/${DEST}")"
            rm -rf "node_modules/${DEST}"
            mv "/tmp/native-${TARBALL_NAME}" "node_modules/${DEST}"
          }

          ROLLUP_VERSION=$(ls node_modules/.pnpm/ | grep '^rollup@[0-9]' | sort -V | tail -1 | sed 's/rollup@//')
          LCSS_VERSION=$(ls node_modules/.pnpm/ | grep '^lightningcss@[0-9]' | sort -V | tail -1 | sed 's/lightningcss@//')
          OXIDE_VERSION=$(ls node_modules/.pnpm/ | grep '^@tailwindcss+oxide@' | sort -V | tail -1 | sed 's/@tailwindcss+oxide@//')
          ESBUILD_VERSION=$(ls node_modules/.pnpm/ | grep '^esbuild@[0-9]' | sort -V | tail -1 | sed 's/esbuild@//')
          echo "Detected versions: rollup=${ROLLUP_VERSION} lightningcss=${LCSS_VERSION} oxide=${OXIDE_VERSION} esbuild=${ESBUILD_VERSION}"

          install_native "@rollup/rollup-darwin-arm64"    "rollup-darwin-arm64"    "@rollup/rollup-darwin-arm64"       "${ROLLUP_VERSION}"
          install_native "lightningcss-darwin-arm64"      "lightningcss-darwin-arm64" "lightningcss-darwin-arm64"      "${LCSS_VERSION}"
          install_native "@tailwindcss/oxide-darwin-arm64" "oxide-darwin-arm64"    "@tailwindcss/oxide-darwin-arm64"   "${OXIDE_VERSION}"
          install_native "@esbuild/darwin-arm64"          "darwin-arm64"           "@esbuild/darwin-arm64"             "${ESBUILD_VERSION}"

          echo "All native addons installed."

      - name: Build Vite web bundle for Capacitor
        script: |
          npx --yes pnpm@10.26.1 --filter @workspace/culinary-scan-assist run build:capacitor

      - name: Sync Capacitor iOS project
        script: |
          cd artifacts/culinary-scan-assist
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          pod install

      - name: Set app version and build number
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch or create App Store signing certificate and profile
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Apply code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "Release"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - support@byte2eat.app
        notify:
          success: true
          failure: true

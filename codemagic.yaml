# Byte 2 Eat — Codemagic CI/CD for iOS App Store
# Developer Portal integration "byte2eat_asc" must be connected in
# Settings → Integrations → Developer Portal before running this workflow.

workflows:

  byte2eat-ios-release:
    name: Byte 2 Eat — iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: byte2eat_asc

    environment:
      groups:
        - byte2eat_env
      vars:
        XCODE_WORKSPACE: "artifacts/culinary-scan-assist/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bitecooking.app"
        APP_VERSION: "1.0.0"
        PNPM: "npx --yes pnpm@10.26.1"
      node: "22"
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install workspace dependencies
        script: |
          set -e
          npx --yes pnpm@10.26.1 install --frozen-lockfile

          # pnpm marks cross-platform optional native packages as '-' (excluded) in
          # lockfiles generated on Linux. Detect the actual resolved versions from the
          # pnpm virtual store, then install the macOS ARM64 native binaries via a
          # clean npm install in /tmp (outside the pnpm workspace) and copy them into
          # root node_modules so Node's module resolution finds them.
          ROLLUP_VERSION=$(ls node_modules/.pnpm/ | grep '^rollup@[0-9]' | sort -V | tail -1 | sed 's/rollup@//')
          LIGHTNINGCSS_VERSION=$(ls node_modules/.pnpm/ | grep '^lightningcss@[0-9]' | sort -V | tail -1 | sed 's/lightningcss@//')
          echo "Detected: rollup@${ROLLUP_VERSION}  lightningcss@${LIGHTNINGCSS_VERSION}"

          mkdir -p /tmp/native-addons
          cd /tmp/native-addons
          npm init -y > /dev/null
          npm install "@rollup/rollup-darwin-arm64@${ROLLUP_VERSION}" "lightningcss-darwin-arm64@${LIGHTNINGCSS_VERSION}"
          cd -

          mkdir -p node_modules/@rollup
          rm -rf node_modules/@rollup/rollup-darwin-arm64 node_modules/lightningcss-darwin-arm64
          cp -r /tmp/native-addons/node_modules/@rollup/rollup-darwin-arm64 node_modules/@rollup/
          cp -r /tmp/native-addons/node_modules/lightningcss-darwin-arm64 node_modules/
          echo "Native addons installed: $(ls node_modules/@rollup/rollup-darwin-arm64) $(ls node_modules/lightningcss-darwin-arm64)"

      - name: Build Vite web bundle for Capacitor
        script: |
          npx --yes pnpm@10.26.1 --filter @workspace/culinary-scan-assist run build:capacitor

      - name: Sync Capacitor iOS project
        script: |
          cd artifacts/culinary-scan-assist
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          pod install

      - name: Set app version and build number
        script: |
          cd artifacts/culinary-scan-assist/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch or create App Store signing certificate and profile
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Apply code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "Release"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - support@byte2eat.app
        notify:
          success: true
          failure: true
